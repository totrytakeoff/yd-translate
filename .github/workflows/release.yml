name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (deb + tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/linux
          cp target/release/yd target/release/yd-gui dist/linux/
          cp packaging/common/yd-gui.desktop packaging/common/yd-gui.png dist/linux/
          cp LICENSE README.md dist/linux/
          tar -C dist/linux -czf "dist/yd-translate-${VERSION}-linux-x86_64.tar.gz" \
            yd yd-gui yd-gui.desktop yd-gui.png LICENSE README.md

      - name: Build deb
        run: ./packaging/deb/build-deb.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item target/release/yd.exe dist/windows/
          Copy-Item target/release/yd-gui.exe dist/windows/
          Copy-Item LICENSE, README.md dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath "dist/yd-translate-$version-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    name: macOS (x86_64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/macos
          cp target/release/yd target/release/yd-gui dist/macos/
          cp LICENSE README.md dist/macos/
          tar -C dist/macos -czf "dist/yd-translate-${VERSION}-macos-x86_64.tar.gz" \
            yd yd-gui LICENSE README.md

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz

  release:
    name: Publish release
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "yd-translate $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/linux/* artifacts/windows/* artifacts/macos/*

  aur:
    name: Update AUR (yd-translate-bin)
    needs: [release]
    runs-on: ubuntu-24.04
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: AUR secret not configured
        if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "AUR_SSH_PRIVATE_KEY 未配置，跳过 AUR 发布"

      - name: Update PKGBUILD version and checksum
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/yd-translate-${VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o /tmp/pkg.tar.gz "$URL"
          SHA="$(sha256sum /tmp/pkg.tar.gz | cut -d' ' -f1)"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" packaging/aur/PKGBUILD
          grep -E '^(pkgver|sha256sums)' packaging/aur/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        if: env.AUR_SSH_PRIVATE_KEY != ''
        with:
          pkgname: yd-translate-bin
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: totrytakeoff
          commit_email: totrytakeoff@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
